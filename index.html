<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Node 2340 — Simple Voter Monitor</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --border: #334155;
    --text: #f8fafc; --muted: #94a3b8;
    --win: #22c55e; --rx: #38bdf8; --idle: #475569;
  }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
  h1 { font-size: 1.35rem; margin: 0; }
  .badge { font-size: 0.8rem; padding: 4px 10px; border-radius: 999px; background: #1e293b; border: 1px solid var(--border); color: var(--muted); }
  .badge.live { color: #4ade80; border-color: #166534; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; transition: border-color 0.15s, box-shadow 0.15s; }
  .card.winner { border-color: var(--win); box-shadow: 0 0 18px rgba(34, 197, 94, 0.22); }
  .card.receiving { border-color: var(--rx); }
  .row-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .node-title { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .pill { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 9px; border-radius: 6px; }
  .pill.win { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
  .pill.rx { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; border: 1px solid #38bdf8; }
  .pill.idle { background: rgba(71, 85, 105, 0.25); color: var(--muted); }
  .pill.disc { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
  .rssi-num { font-family: ui-monospace, monospace; font-size: 1.1rem; font-weight: 700; }
  .bar-bg { width: 100%; height: 22px; background: #0b1120; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); position: relative; }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0284c7, #38bdf8); transition: width 0.15s ease-out; }
  .card.winner .bar-fill { background: linear-gradient(90deg, #16a34a, #4ade80); }
  .ticks { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); margin-top: 5px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Node 2340 &mdash; Simple Voter Live RSSI</h1>
    <span id="conn" class="badge">Connecting...</span>
  </header>
  <div id="nodes"></div>
</div>

<script>
const labels = {
  "2340": "Node 2340 (Main Repeater RX)",
  "5101": "Node 5101 (Reynolds Road)",
  "5102": "Node 5102 (Bloss Mtn)"
};

function render(data) {
  const container = document.getElementById("nodes");
  const order = ["2340", "5101", "5102"];
  container.innerHTML = order.map(id => {
    const n = data.nodes[id] || { rssi: 0, state: "IDLE", connected: false };
    const pct = Math.min(100, Math.max(0, Math.round((n.rssi / 999) * 100)));
    let cardCls = "card";
    let pillHtml = `<span class="pill idle">Idle</span>`;
    if (!n.connected && id !== "2340") {
      pillHtml = `<span class="pill disc">Disconnected</span>`;
    } else if (data.winner === id && n.rssi > 0) {
      cardCls += " winner";
      pillHtml = `<span class="pill win">Voted Active</span>`;
    } else if (n.state === "RX" || n.rssi > 0) {
      cardCls += " receiving";
      pillHtml = `<span class="pill rx">Receiving</span>`;
    }
    return `
      <div class="${cardCls}">
        <div class="row-top">
          <div class="node-title">${labels[id] || "Node " + id} ${pillHtml}</div>
          <div class="rssi-num">RSSI: ${n.rssi} <span style="color:#64748b;font-size:0.85rem">/ 999</span></div>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="ticks"><span>0</span><span>250</span><span>500</span><span>750</span><span>999</span></div>
      </div>`;
  }).join("");
}

async function poll() {
  const badge = document.getElementById("conn");
  try {
    const res = await fetch("status.json?_=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    badge.textContent = "LIVE • Updated " + data.updated;
    badge.className = "badge live";
    render(data);
  } catch (e) {
    badge.textContent = "Waiting for collector...";
    badge.className = "badge";
  }
}
setInterval(poll, 350);
poll();
</script>
</body>
</html>
